[project]
name = "webi-change-source"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyrefly",
    "requests",
    "ruff",
    "sqlalchemy",
    "typer",
    "tqdm"
]
[project.scripts]
webi_change_source = "webi_change_source.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"