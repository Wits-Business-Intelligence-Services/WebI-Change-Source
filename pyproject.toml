[project]
name = "webi-change-source"
description = "A CLI tool for converting SAP Business Objects document queries from UNV to UNX"
version = "1.1.0"
requires-python = ">=3.14"
dependencies = [
    "requests==2.34.2",
    "sqlalchemy==2.1.6",
    "typer==0.27.3",
    "tqdm==4.70.1",
    "rich==15.0.0",
]
[project.scripts]
webi_change_source = "webi_change_source.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
