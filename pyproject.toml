[project]
name = "webi-change-source"
version = "0.9.0"
requires-python = ">=3.14"
dependencies = [
    "pyrefly==1.2.0",
    "requests==2.34.2",
    "ruff==0.16.5",
    "sqlalchemy==2.0.52",
    "typer==0.27.2",
    "tqdm==4.70.0",
    "rich==15.0.0",
]
[project.scripts]
webi_change_source = "webi_change_source.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"